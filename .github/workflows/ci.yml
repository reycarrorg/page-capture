name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos-core:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and test native macOS core
        run: swift test --package-path macos --scratch-path "$RUNNER_TEMP/page-capture-build"

  legacy-python-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compile recovered Windows Python source
        run: python3 -m py_compile legacy/windows/page_capture.py
