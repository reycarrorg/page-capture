name: Windows build

on:
  push:
    paths: ['windows/**', 'docs/WINDOWS.md', '.github/workflows/windows.yml', 'LICENSE.md', 'README.md']
  pull_request:
    paths: ['windows/**', 'docs/WINDOWS.md', '.github/workflows/windows.yml', 'LICENSE.md', 'README.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: windows/requirements*.txt
      - name: Install pinned dependencies
        run: python -m pip install -r windows/requirements-build.txt
      - name: Core regression checks
        run: python -m unittest discover -s windows/tests -p 'test_*.py' -v
      - name: Hidden-widget integration checks
        run: python windows/tests/ui_smoke.py
      - name: Build portable application
        run: python windows/build.py
      - name: Verify packaged runtime and PDF workflow
        shell: pwsh
        run: |
          $process = Start-Process -FilePath '.\dist\PageCapture\PageCapture.exe' -ArgumentList '--verify', 'windows/.verification/ci' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Packaged verification failed: $($process.ExitCode)" }
          $receipt = Get-Content -LiteralPath 'windows/.verification/ci/verification.json' -Raw | ConvertFrom-Json
          if (-not $receipt.passed -or $receipt.page_count -ne 3 -or -not $receipt.hidden_gui_runtime.hidden) { throw 'Packaged receipt did not confirm success.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PageCapture-Windows
          path: |
            dist/PageCapture-Windows-*.zip
            dist/windows-build-receipt.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Windows-verification
          path: windows/.verification/ci/*.json
          if-no-files-found: ignore
